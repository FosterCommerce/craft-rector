# covers https://github.com/craftcms/rector/issues/5
name: Install in Craft CMS

on:
    pull_request: null
    push:
        branches:
            - 2.x
permissions:
  contents: read
jobs:
    install_in_craftcms:
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v6
                with:
                    path: rector

            # see https://github.com/shivammathur/setup-php
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.2
                    coverage: none

            -   run: git clone https://github.com/craftcms/cms.git --depth 1
            -   run: cd cms && composer config repositories.rector path ../rector
            -   run: cd cms && composer require fostercommerce/craft-rector:@dev --dev --with-all-dependencies --ansi
